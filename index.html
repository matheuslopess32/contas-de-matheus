<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contas de Matheus</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
<div id="login" class="min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-white p-6 rounded-3xl border shadow-sm">
    <h1 class="text-2xl font-bold text-center">💰 Contas de Matheus</h1>
    <p class="text-sm text-slate-500 text-center mt-2 mb-5">Entre para sincronizar celular e computador.</p>
    <input id="email" type="email" placeholder="E-mail" class="w-full border rounded-xl p-3 mb-3">
    <input id="senha" type="password" placeholder="Senha (mínimo 6 caracteres)" class="w-full border rounded-xl p-3 mb-3">
    <button id="entrar" class="w-full bg-blue-600 text-white font-bold rounded-xl p-3 mb-2">Entrar</button>
    <button id="criar" class="w-full border border-blue-200 text-blue-700 font-bold rounded-xl p-3">Criar conta</button>
    <div id="msg" class="text-sm mt-3"></div>
  </div>
</div>

<div id="app" class="hidden max-w-4xl mx-auto p-4">
  <header class="bg-slate-900 text-white rounded-2xl p-5 mb-4">
    <div class="flex justify-between gap-3">
      <div>
        <h1 class="text-2xl font-bold">💰 Contas de Matheus</h1>
        <div id="dataHoje" class="text-sm text-slate-300 mt-1"></div>
      </div>
      <div class="text-right">
        <div id="sync" class="text-xs bg-white/10 rounded-full px-2 py-1">☁️ Sincronizando</div>
        <button id="sair" class="text-xs mt-2 underline">Sair</button>
      </div>
    </div>
  </header>

  <section class="bg-white border rounded-2xl p-4 mb-4">
    <label class="text-xs uppercase font-bold text-slate-500">Renda mensal</label>
    <div class="flex gap-2 mt-1">
      <input id="renda" type="number" step="0.01" min="0" class="border rounded-xl p-3 flex-1" placeholder="Ex.: 1800">
      <button id="salvarRenda" class="bg-blue-600 text-white font-bold rounded-xl px-4">Salvar</button>
    </div>
  </section>

  <section class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">
    <div class="bg-white border rounded-2xl p-4"><div class="text-xs text-slate-500">A PAGAR NO MÊS</div><b id="mensal" class="text-lg"></b></div>
    <div class="bg-white border rounded-2xl p-4"><div class="text-xs text-slate-500">SALDO DEVEDOR</div><b id="devedor" class="text-lg text-red-600"></b></div>
    <div class="bg-white border rounded-2xl p-4"><div class="text-xs text-slate-500">CONTAS ATIVAS</div><b id="ativas" class="text-lg"></b></div>
    <div class="bg-white border rounded-2xl p-4"><div class="text-xs text-slate-500">SOBRA APÓS PARCELAS</div><b id="sobra" class="text-lg"></b></div>
  </section>

  <div class="flex items-center justify-between mb-3">
    <h2 class="text-xl font-bold">Contas ativas</h2>
    <button id="nova" class="bg-emerald-600 text-white font-bold rounded-xl px-4 py-2">+ Nova conta</button>
  </div>
  <div id="listaAtivas" class="space-y-3 mb-6"></div>

  <h2 class="text-xl font-bold mb-3">✅ Quitadas</h2>
  <div id="listaQuitadas" class="space-y-3"></div>
</div>

<div id="modal" class="hidden fixed inset-0 bg-black/50 items-center justify-center p-4">
  <div class="bg-white rounded-2xl p-5 w-full max-w-md">
    <div class="flex justify-between mb-3"><h3 id="tituloModal" class="font-bold text-xl">Nova conta</h3><button id="fechar">✕</button></div>
    <input id="idEdit" type="hidden">
    <input id="nome" placeholder="Descrição" class="w-full border rounded-xl p-3 mb-3">
    <input id="valor" type="number" step="0.01" min="0" placeholder="Valor total" class="w-full border rounded-xl p-3 mb-3">
    <div class="grid grid-cols-2 gap-3 mb-3">
      <input id="parcelas" type="number" min="1" value="1" placeholder="Parcelas" class="border rounded-xl p-3">
      <input id="pagas" type="number" min="0" value="0" placeholder="Já pagas" class="border rounded-xl p-3">
    </div>
    <button id="salvar" class="w-full bg-blue-600 text-white font-bold rounded-xl p-3">Salvar</button>
    <button id="excluir" class="hidden w-full text-red-600 font-bold p-3 mt-2">Excluir</button>
  </div>
</div>

<script>
const URL="https://ttfgefdggcnkcahazfgn.supabase.co";
const KEY="sb_publishable_sSV95iogghc2Vsjt9WE5tQ__TzKUdKp";
const sb=supabase.createClient(URL,KEY);

const PADRAO=[
 {produto:"Notebook",valor:3612.40,parcelas:10,paga:6},
 {produto:"Empréstimo Agibank",valor:3811.68,parcelas:18,paga:8},
 {produto:"Cartão de Crédito",valor:208.08,parcelas:1,paga:1},
 {produto:"Nubank Empréstimo",valor:571.00,parcelas:7,paga:5},
 {produto:"Nubank Reforma",valor:256.48,parcelas:4,paga:3},
 {produto:"Paraíba",valor:358.20,parcelas:6,paga:6},
 {produto:"CredShop",valor:50.00,parcelas:1,paga:1},
 {produto:"Plano Tim",valor:39.99,parcelas:1,paga:1}
];

let user=null, contas=[], renda=0, canal=null;
const $=x=>document.getElementById(x);
const moeda=n=>Number(n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const parcela=x=>x.valor/x.parcelas;
const restante=x=>parcela(x)*Math.max(0,x.parcelas-x.paga);
const html=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));

function status(t){$("sync").textContent=t}
function mensagem(t,erro=false){$("msg").textContent=t;$("msg").className="text-sm mt-3 "+(erro?"text-red-600":"text-emerald-600")}
function dadosLocais(){
  try{
    const raw=localStorage.getItem("matheus_fin_v4")||localStorage.getItem("matheus_fin_v3");
    const a=raw?JSON.parse(raw):null;
    if(!Array.isArray(a)||!a.length)return null;
    return a.map(x=>({produto:String(x.produto||"Conta"),valor:Number(x.valor)||0,parcelas:Math.max(1,Number(x.parcelas)||1),paga:Math.max(0,Math.min(Number(x.parcelas)||1,Number(x.paga)||0))})).filter(x=>x.valor>0);
  }catch(e){return null}
}
async function migrar(){
  const {data,error}=await sb.from("finance_accounts").select("id").limit(1);
  if(error)throw error;
  if(data.length)return;
  const base=dadosLocais()||PADRAO;
  const {error:e}=await sb.from("finance_accounts").insert(base.map(x=>({...x,user_id:user.id})));
  if(e)throw e;
  const r=Number(localStorage.getItem("matheus_income")||0);
  if(r>0)await sb.from("finance_settings").upsert({user_id:user.id,renda_mensal:r});
}
async function carregar(){
  if(!user)return;
  status("☁️ Sincronizando");
  await migrar();
  const [a,b]=await Promise.all([
    sb.from("finance_accounts").select("*").order("created_at"),
    sb.from("finance_settings").select("renda_mensal").maybeSingle()
  ]);
  if(a.error)throw a.error;if(b.error)throw b.error;
  contas=(a.data||[]).map(x=>({...x,valor:Number(x.valor),parcelas:Number(x.parcelas),paga:Number(x.paga)}));
  renda=Number(b.data?.renda_mensal||0);
  $("renda").value=renda||"";
  render();
  status("☁️ Sincronizado");
}
function render(){
  const at=contas.filter(x=>x.paga<x.parcelas), q=contas.filter(x=>x.paga>=x.parcelas);
  const mensal=at.reduce((s,x)=>s+parcela(x),0), dev=at.reduce((s,x)=>s+restante(x),0);
  $("mensal").textContent=moeda(mensal);$("devedor").textContent=moeda(dev);$("ativas").textContent=at.length;
  $("sobra").textContent=renda>0?moeda(renda-mensal):"—";
  $("listaAtivas").innerHTML=at.length?at.map(x=>`
    <div class="bg-white border rounded-2xl p-4">
      <div class="flex justify-between gap-3"><div><b class="text-lg">${html(x.produto)}</b><div class="text-xs text-slate-500">${x.paga}/${x.parcelas} pagas · faltam ${x.parcelas-x.paga}</div></div><button onclick="editar(${x.id})" class="text-blue-600">Editar</button></div>
      <div class="grid grid-cols-3 gap-2 mt-3 text-sm"><div>Parcela<br><b>${moeda(parcela(x))}</b></div><div>Restante<br><b class="text-red-600">${moeda(restante(x))}</b></div><div>Total<br><b>${moeda(x.valor)}</b></div></div>
      <button onclick="pagar(${x.id})" class="w-full mt-3 border border-emerald-300 text-emerald-700 font-bold rounded-xl py-2">✓ Marcar 1 parcela como paga</button>
    </div>`).join(""):'<div class="bg-white border rounded-2xl p-4">Nenhuma conta ativa 🎉</div>';
  $("listaQuitadas").innerHTML=q.length?q.map(x=>`<div class="bg-white border rounded-2xl p-4 flex justify-between"><div><b>${html(x.produto)}</b><div class="text-xs text-slate-500">${moeda(x.valor)} · quitada</div></div><button onclick="editar(${x.id})" class="text-blue-600">Editar</button></div>`).join(""):'<div class="bg-white border rounded-2xl p-4">Nenhuma conta quitada.</div>';
}
async function pagar(id){
  const x=contas.find(c=>c.id===id);if(!x||x.paga>=x.parcelas)return;
  if(!confirm(`Confirmar pagamento de uma parcela de "${x.produto}"?`))return;
  status("☁️ Salvando...");
  const {error}=await sb.from("finance_accounts").update({paga:x.paga+1}).eq("id",id);
  if(error)return alert(error.message);await carregar();
}
window.pagar=pagar;
function abrir(){$("modal").classList.remove("hidden");$("modal").classList.add("flex")}
function fechar(){$("modal").classList.add("hidden");$("modal").classList.remove("flex")}
$("nova").onclick=()=>{$("idEdit").value="";$("nome").value="";$("valor").value="";$("parcelas").value=1;$("pagas").value=0;$("excluir").classList.add("hidden");$("tituloModal").textContent="Nova conta";abrir()}
window.editar=id=>{const x=contas.find(c=>c.id===id);$("idEdit").value=x.id;$("nome").value=x.produto;$("valor").value=x.valor;$("parcelas").value=x.parcelas;$("pagas").value=x.paga;$("excluir").classList.remove("hidden");$("tituloModal").textContent="Editar conta";abrir()}
$("fechar").onclick=fechar;
$("salvar").onclick=async()=>{
  const produto=$("nome").value.trim(),valor=Number($("valor").value),parcelas=Math.max(1,Number($("parcelas").value)||1),paga=Math.max(0,Math.min(parcelas,Number($("pagas").value)||0));
  if(!produto||valor<=0)return alert("Preencha nome e valor.");
  status("☁️ Salvando...");
  let r;
  if($("idEdit").value)r=await sb.from("finance_accounts").update({produto,valor,parcelas,paga}).eq("id",Number($("idEdit").value));
  else r=await sb.from("finance_accounts").insert({user_id:user.id,produto,valor,parcelas,paga});
  if(r.error)return alert(r.error.message);fechar();await carregar();
}
$("excluir").onclick=async()=>{if(!confirm("Excluir esta conta?"))return;const {error}=await sb.from("finance_accounts").delete().eq("id",Number($("idEdit").value));if(error)return alert(error.message);fechar();await carregar()}
$("salvarRenda").onclick=async()=>{renda=Math.max(0,Number($("renda").value)||0);status("☁️ Salvando...");const {error}=await sb.from("finance_settings").upsert({user_id:user.id,renda_mensal:renda});if(error)return alert(error.message);await carregar()}
$("entrar").onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:$("email").value.trim(),password:$("senha").value});if(error)mensagem("Não consegui entrar: "+error.message,true)}
$("criar").onclick=async()=>{
  const email=$("email").value.trim(),password=$("senha").value;
  if(!email||password.length<6)return mensagem("Use e-mail válido e senha com pelo menos 6 caracteres.",true);
  const {data,error}=await sb.auth.signUp({email,password,options:{emailRedirectTo:location.origin+location.pathname}});
  if(error)return mensagem("Não consegui criar: "+error.message,true);
  mensagem(data.session?"Conta criada. Entrando...":"Conta criada. Confira seu e-mail para confirmar e depois volte para entrar.");
}
$("sair").onclick=()=>sb.auth.signOut();

async function entrarApp(session){
  user=session.user;$("login").classList.add("hidden");$("app").classList.remove("hidden");
  try{
    await carregar();
    if(canal)sb.removeChannel(canal);
    canal=sb.channel("fin-"+user.id)
      .on("postgres_changes",{event:"*",schema:"public",table:"finance_accounts"},()=>carregar())
      .on("postgres_changes",{event:"*",schema:"public",table:"finance_settings"},()=>carregar())
      .subscribe();
  }catch(e){status("⚠️ Erro");alert("Erro ao sincronizar: "+e.message)}
}
function sairApp(){user=null;contas=[];renda=0;if(canal){sb.removeChannel(canal);canal=null}$("app").classList.add("hidden");$("login").classList.remove("hidden")}
sb.auth.onAuthStateChange((e,s)=>setTimeout(()=>s?entrarApp(s):sairApp(),0));
$("dataHoje").textContent="Hoje: "+new Date().toLocaleDateString("pt-BR");
(async()=>{const {data:{session}}=await sb.auth.getSession();session?entrarApp(session):sairApp()})();
</script>
</body>
</html>
